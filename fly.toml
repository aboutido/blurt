# Deploy on Fly.io:  fly launch --copy-config --no-deploy  then  fly volumes create blurt_data --size 1  then  fly deploy
app = "blurt-quiz-change-me"
primary_region = "lhr"

[env]
  PORT = "3000"
  DATA_DIR = "/data"
  TRUST_PROXY = "1"

[http_service]
  internal_port = 3000
  force_https = true
  # Live games keep connections open, so don't let the machine stop mid-game.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "blurt_data"
  destination = "/data"

[[vm]]
  memory = "256mb"
